server {
    listen 3141;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The training API lives in server.py (dev only); the image ships no
    # backend, so /api/ must not be answered by the SPA fallback with HTML.
    location /api/ {
        return 404;
    }

    location / {
        # Single-page app: unknown paths fall back to the entry document.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed build assets are immutable; the 21 MB Giac/WASM bundle is not
    # hashed, so keep its cache short.
    location ~* \.(js|css|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
